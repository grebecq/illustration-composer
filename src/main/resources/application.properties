spring.application.name=illustration-composer
server.port=8080

# Подбор объектов по метафоре через ИИ. Подключить можно и на странице (кнопка «ИИ» вверху).
# Если ничего не задано, при старте используется локальная Ollama, а при её отсутствии — поиск по тегам.
#   composer.llm.provider   ollama | lmstudio | openrouter | openai | anthropic | custom
#   composer.llm.base-url   адрес API (для известных сервисов можно не указывать)
#   composer.llm.model      название модели
#   composer.llm.api-key    ключ (или переменные окружения ANTHROPIC_API_KEY / OPENROUTER_API_KEY)
composer.llm.provider=${LLM_PROVIDER:}
composer.llm.base-url=${LLM_BASE_URL:}
composer.llm.model=${LLM_MODEL:}
composer.llm.api-key=${LLM_API_KEY:}
composer.llm.autodetect=true
composer.llm.timeout-seconds=45
# true — запретить менять настройки ИИ со страницы (для публичного показа)
composer.llm.locked=${LLM_LOCKED:false}
